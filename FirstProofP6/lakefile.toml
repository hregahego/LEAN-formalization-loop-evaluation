name = "TreeIrred"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TreeIrred"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# `linter.style.header` demands a Mathlib copyright header on every module; this
# project is not Mathlib, and the warning would break `verify.py`'s clean-build
# check. Every substantive linter of the standard set stays on.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "TreeIrred"
